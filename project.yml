name: Undertow
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"
settings:
  base:
    SWIFT_VERSION: "5"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Undertow:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
        excludes: [Info.plist]
      - Sources/Engine
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.undertow.Undertow
        PRODUCT_NAME: Undertow
        PRODUCT_MODULE_NAME: Undertow
        SDKROOT: macosx
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging/Undertow-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/llama.cpp/include
          - $(SRCROOT)/Vendor/llama.cpp/ggml/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/llama.cpp/build/src
          - $(SRCROOT)/Vendor/llama.cpp/build/ggml/src
          - $(SRCROOT)/Vendor/llama.cpp/build/ggml/src/ggml-metal
          - $(SRCROOT)/Vendor/llama.cpp/build/ggml/src/ggml-blas
        OTHER_LDFLAGS:
          - -lllama
          - -lggml
          - -lggml-base
          - -lggml-cpu
          - -lggml-metal
          - -lggml-blas
          - -lc++
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_FILE: Sources/App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Undertow
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Developer ID keeps the signature stable across rebuilds, so the Accessibility grant sticks.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: V9RB94626Z
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_OPTIMIZATION_LEVEL: -O
        SWIFT_COMPILATION_MODE: wholemodule
    dependencies:
      - package: Sparkle
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
